# AWS Amplify build settings for this frontend-only repository.
# Set VITE_API_URL (the API Gateway URL ending in /api) in Amplify > Environment variables.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
